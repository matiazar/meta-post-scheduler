# Todo el proyecto con un comando: docker compose up -d --build
# Antes: crear el .env (ver "Con Docker" en el README)
name: meta-post-scheduler

x-api: &api
  # Una sola imagen para migrate, api y worker (cambia solo el comando)
  image: meta-post-scheduler-api
  build:
    context: .
    target: api
  env_file:
    - path: .env
      required: false
  environment:
    NODE_ENV: production
    PORT: 3001
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-}@db:5432/social_publisher
    REDIS_URL: redis://redis:6379/0
    # Se derivan de los puertos; solo se definen en .env si usas dominios propios
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-3000}}
    META_REDIRECT_URI: ${META_REDIRECT_URI:-http://localhost:${API_PORT:-3001}/meta/callback}
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: social_publisher
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_publisher"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Aplica las migraciones y termina; la API y el worker esperan a que acabe bien
  migrate:
    <<: *api
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # El que publica en el horario programado
  worker:
    <<: *api
    command: ["node", "dist/worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-3001}}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

  # Asistente para crear el .env: docker compose run --rm init
  init:
    build:
      context: .
      target: init
    profiles: ["setup"]
    volumes:
      - ./:/host
    stdin_open: true
    tty: true

volumes:
  pgdata:
  redisdata:
